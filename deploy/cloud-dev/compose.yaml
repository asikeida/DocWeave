name: docweave-dev

services:
  mysql:
    image: mysql:8.4.13
    container_name: docweave-dev-mysql
    restart: unless-stopped
    mem_limit: 1g
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=40
      - --mysqlx=0
    environment:
      MYSQL_DATABASE: ${DOCWEAVE_DB_NAME:-docweave_dev}
      MYSQL_USER: ${DOCWEAVE_DB_USERNAME:-docweave_dev}
      MYSQL_PASSWORD: ${DOCWEAVE_DB_PASSWORD:?Set DOCWEAVE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DOCWEAVE_DB_ROOT_PASSWORD:?Set DOCWEAVE_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
