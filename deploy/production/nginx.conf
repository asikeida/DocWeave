# 独立 443 站点；宿主机 Nginx 提供静态页面及同源 API。
# 证书由部署环境提供，必须覆盖访问用公网 IP，并具备自动续期。
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/docweave-certs/fullchain.pem;
    ssl_certificate_key /etc/docweave-certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/apps/docweave/current/frontend-dist;
    index index.html;
    client_max_body_size 10m;
    access_log /var/log/nginx/docweave-access.log;
    error_log /var/log/nginx/docweave-error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control 'no-store' always;
    }
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8081;
    }
    location /actuator/ { return 404; }
    location /v3/api-docs { return 404; }
    location /swagger-ui { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control 'public, immutable';
    }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location / { try_files $uri $uri/ /index.html; }
}
