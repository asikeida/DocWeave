spring:
  datasource:
    url: jdbc:h2:mem:docweave;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

docweave:
  samples:
    worker-enabled: false
  auth:
    cookie-secure: false
    login-attempts-per-minute: 1000
