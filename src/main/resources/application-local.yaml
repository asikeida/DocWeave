spring:
  datasource:
    url: jdbc:mysql://${DOCWEAVE_DB_HOST:localhost}:${DOCWEAVE_DB_PORT:3306}/${DOCWEAVE_DB_NAME:docweave}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DOCWEAVE_DB_USERNAME}
    password: ${DOCWEAVE_DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  file:
    name: .local/logs/docweave.log
  logback:
    rollingpolicy:
      file-name-pattern: .local/logs/docweave.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
      clean-history-on-start: true
