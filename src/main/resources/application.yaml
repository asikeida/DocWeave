spring:
  application:
    name: docweave
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'

docweave:
  documents:
    root: ${DOCWEAVE_STORAGE_ROOT:.local/files}
    write-enabled: false
    max-file-bytes: 20971520
    max-user-bytes: 104857600
    max-concurrent: 2
    daily-limit: 30
    upload-lease: 15m
  auth:
    # 访问令牌有效期；代码校验上限为 15 分钟。
    access-ttl: 5m
    # 一次登录的绝对期限；刷新不会延长，上限为 30 天。
    login-ttl: 7d
    # local/test 覆盖为 false；prod 禁止关闭。
    cookie-secure: true
    issuer: docweave
    audience: docweave-api
    login-attempts-per-minute: 20
    # 仅引用环境变量，不在此保存真实密钥；留空沿用开发/测试密钥策略。
    jwt-secret: ${DOCWEAVE_JWT_SECRET:}
