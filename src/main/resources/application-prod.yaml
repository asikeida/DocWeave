spring:
  datasource:
    url: jdbc:mysql://${DOCWEAVE_DB_HOST}:${DOCWEAVE_DB_PORT:3306}/${DOCWEAVE_DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DOCWEAVE_DB_USERNAME}
    password: ${DOCWEAVE_DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
