name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend verify (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Run tests and build JAR
        id: verify
        run: bash ./mvnw --batch-mode --no-transfer-progress -Dstyle.color=never verify

      - name: Upload test reports on failure
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
            target/failsafe-reports/*.xml
            target/failsafe-reports/*.txt
          if-no-files-found: warn
          retention-days: 7
